version: 1.0
provider:
  name: openfaas
  gateway: "http://127.0.0.1:8080"
functions:

  sebs-502-graph-mst-cpython:
    lang: python3-http-flex
    handler: ./sebs-502-graph-mst
    image: matheusschreiber/sebs-502-graph-mst-cpython:latest
    limits: { memory: 256Mi }
    environment: { read_timeout: 60s, write_timeout: 60s, exec_timeout: 60s }

  sebs-502-graph-mst-pypy-jit:
    lang: python3-http-flex
    handler: ./sebs-502-graph-mst
    image: matheusschreiber/sebs-502-graph-mst-pypy:latest
    build_args:
      BASE_IMAGE: pypy:3.10-slim-bookworm
      PYTHON_BIN: pypy3
    limits: { memory: 256Mi }
    environment: { read_timeout: 60s, write_timeout: 60s, exec_timeout: 60s }

  sebs-502-graph-mst-pypy-nojit:
    lang: python3-http-flex
    handler: ./sebs-502-graph-mst
    image: matheusschreiber/sebs-502-graph-mst-pypy:latest
    build_args:
      BASE_IMAGE: pypy:3.10-slim-bookworm
      PYTHON_BIN: pypy3
      PYTHON_FLAGS: "--jit off"
    limits: { memory: 256Mi }
    environment: { read_timeout: 60s, write_timeout: 60s, exec_timeout: 60s }