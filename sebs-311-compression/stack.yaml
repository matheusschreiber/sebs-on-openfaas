version: 1.0
provider:
  name: openfaas
  gateway: "http://127.0.0.1:8080"
functions:

  sebs-311-compression-cpython:
    lang: python3-http-flex
    handler: ./sebs-311-compression
    image: matheusschreiber/sebs-311-compression-cpython:latest
    limits:
      memory: 256Mi
    environment:
      read_timeout: 60s
      write_timeout: 60s
      exec_timeout: 60s
      MINIO_STORAGE_CONNECTION_URL: "192.168.0.100:9011"
      MINIO_STORAGE_ACCESS_KEY: "f4onfl-avKD2y-_haxzsKv-RX_HoZbv8O7HTlT35OMw"
      MINIO_STORAGE_SECRET_KEY: "d0d65425a1a8b5481c7055ca523680a9cec29352a311219807a8dd6d5bf8cc11"

  sebs-311-compression-pypy-jit:
    lang: python3-http-flex
    handler: ./sebs-311-compression
    image: matheusschreiber/sebs-311-compression-pypy:latest
    build_args:
      BASE_IMAGE: pypy:3.12-slim-bookworm
      PYTHON_BIN: pypy3
    limits:
      memory: 256Mi
    environment:
      read_timeout: 60s
      write_timeout: 60s
      exec_timeout: 60s
      MINIO_STORAGE_CONNECTION_URL: "192.168.0.100:9011"
      MINIO_STORAGE_ACCESS_KEY: "f4onfl-avKD2y-_haxzsKv-RX_HoZbv8O7HTlT35OMw"
      MINIO_STORAGE_SECRET_KEY: "d0d65425a1a8b5481c7055ca523680a9cec29352a311219807a8dd6d5bf8cc11"

  sebs-311-compression-pypy-nojit:
    lang: python3-http-flex
    handler: ./sebs-311-compression
    image: matheusschreiber/sebs-311-compression-pypy:latest
    build_args:
      BASE_IMAGE: pypy:3.12-slim-bookworm
      PYTHON_BIN: pypy3
      PYTHON_FLAGS: "--jit off"
    limits:
      memory: 256Mi
    environment:
      read_timeout: 60s
      write_timeout: 60s
      exec_timeout: 60s
      MINIO_STORAGE_CONNECTION_URL: "192.168.0.100:9011"
      MINIO_STORAGE_ACCESS_KEY: "f4onfl-avKD2y-_haxzsKv-RX_HoZbv8O7HTlT35OMw"
      MINIO_STORAGE_SECRET_KEY: "d0d65425a1a8b5481c7055ca523680a9cec29352a311219807a8dd6d5bf8cc11"