version: 1.0
provider:
  name: openfaas
  gateway: "http://127.0.0.1:8080"
functions:
  sebs-010-sleep:
    lang: python3-http-debian
    handler: ./sebs-010-sleep
    image: matheusschreiber/sebs-010-sleep:latest
    limits:
      memory: 128Mi
    environment:
      read_timeout: 30s
      write_timeout: 30s
      exec_timeout: 30s

  sebs-110-dynamic-html-cpython:
    lang: python3-http-flex
    handler: ./sebs-110-dynamic-html
    image: matheusschreiber/sebs-110-dynamic-html-cpython:latest
    limits: { memory: 256Mi }
    environment: { read_timeout: 60s, write_timeout: 60s, exec_timeout: 60s }

  sebs-110-dynamic-html-pypy-jit:
    lang: python3-http-flex
    handler: ./sebs-110-dynamic-html
    image: matheusschreiber/sebs-110-dynamic-html-pypy-jit:latest
    build_args:
      BASE_IMAGE: pypy:3.10-slim-bookworm
      PYTHON_BIN: pypy3
    limits: { memory: 256Mi }
    environment: { read_timeout: 60s, write_timeout: 60s, exec_timeout: 60s }

  sebs-110-dynamic-html-pypy-nojit:
    lang: python3-http-flex
    handler: ./sebs-110-dynamic-html
    image: matheusschreiber/sebs-110-dynamic-html-pypy-nojit:latest
    build_args:
      BASE_IMAGE: pypy:3.10-slim-bookworm
      PYTHON_BIN: pypy3
      PYTHON_FLAGS: "--jit off"
    limits: { memory: 256Mi }
    environment: { read_timeout: 60s, write_timeout: 60s, exec_timeout: 60s }

  sebs-120-uploader:
    lang: python3-http-debian
    handler: ./sebs-120-uploader
    image: matheusschreiber/sebs-120-uploader:latest
    limits:
      memory: 128Mi
    environment:
      read_timeout: 30s
      write_timeout: 30s
      exec_timeout: 30s
      MINIO_STORAGE_CONNECTION_URL: "10.31.112.98:9011"
      MINIO_STORAGE_ACCESS_KEY: "TK24Gq8YyzVcqPx_lXNBuZ-vwohCE-fTYCsEVWDiyIc"
      MINIO_STORAGE_SECRET_KEY: "1fa4101b57d2c1ebb4836688791836570340e25e57c877bc1bc0f9dd5b7fd856"

