    lang: python3-http-debian
    handler: ./sebs-010-sleep
    image: matheusschreiber/sebs-010-sleep:latest
    limits:
      memory: 128Mi
    environment:
      read_timeout: 30s
      write_timeout: 30s
      exec_timeout: 30s

