version: 1.0
provider:
  name: openfaas
  gateway: "http://127.0.0.1:8080"
functions:

  sebs-130-crud-api-cpython:
    lang: python3-http-flex
    handler: ./sebs-130-crud-api
    image: matheusschreiber/sebs-130-crud-api-cpython:latest
    limits:
      memory: 256Mi
    environment:
      read_timeout: 60s
      write_timeout: 60s
      exec_timeout: 60s
      NOSQL_STORAGE_TYPE: "scylladb"
      NOSQL_STORAGE_ENDPOINT: "192.168.0.100:9012"
      NOSQL_STORAGE_TABLE_shopping_cart: "shopping_cart"

  sebs-130-crud-api-pypy-jit:
    lang: python3-http-flex
    handler: ./sebs-130-crud-api
    image: matheusschreiber/sebs-130-crud-api-pypy:latest
    build_args:
      BASE_IMAGE: pypy:3.12-slim-bookworm
      PYTHON_BIN: pypy3
    limits:
      memory: 256Mi
    environment:
      read_timeout: 60s
      write_timeout: 60s
      exec_timeout: 60s
      NOSQL_STORAGE_TYPE: "scylladb"
      NOSQL_STORAGE_ENDPOINT: "192.168.0.100:9012"
      NOSQL_STORAGE_TABLE_shopping_cart: "shopping_cart"

  sebs-130-crud-api-pypy-nojit:
    lang: python3-http-flex
    handler: ./sebs-130-crud-api
    image: matheusschreiber/sebs-130-crud-api-pypy:latest
    build_args:
      BASE_IMAGE: pypy:3.12-slim-bookworm
      PYTHON_BIN: pypy3
      PYTHON_FLAGS: "--jit off"
    limits:
      memory: 256Mi
    environment:
      read_timeout: 60s
      write_timeout: 60s
      exec_timeout: 60s
      NOSQL_STORAGE_TYPE: "scylladb"
      NOSQL_STORAGE_ENDPOINT: "192.168.0.100:9012"
      NOSQL_STORAGE_TABLE_shopping_cart: "shopping_cart"